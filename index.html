<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="color-scheme" content="dark" />
    <!--
      The page's stylesheet arrives as a separate file (and, under the dev
      server, only after the script runs), so until then the static hero below
      would render black-on-white in the top-left corner and then jump. These
      rules paint it in the app's own colours and place the hero where the
      app will draw it, header gap included. Keep them in step with the tokens
      and the .main / .landing rules in src/index.css. `.app--static` exists
      only in this markup, so none of it applies once React has mounted.
    -->
    <style>
      html, body { margin: 0; background: #0b0b0f; color: #f2f2f5; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
      .app--static .main { max-width: 1080px; margin: 0 auto; padding: 109px 24px 0; box-sizing: border-box; }
      .app--static .landing { max-width: 680px; margin: 48px auto 0; text-align: center; }
      .app--static .landing__title { font-size: 42px; line-height: 1.15; margin: 0 0 16px; letter-spacing: -0.02em; }
      .app--static .accent { color: #ff007a; }
      .app--static .landing__lede { color: #8b8b9a; font-size: 17px; line-height: 1.6; margin: 0; }
      @media (max-width: 720px) {
        .app--static .main { padding: 85px 14px 0; }
        .app--static .landing { margin-top: 24px; }
        .app--static .landing__title { font-size: 30px; }
        .app--static .landing__lede { font-size: 16px; }
      }
    </style>

    <title>Claim Uniswap Fees from Multiple Positions at Once | UniClaim</title>
    <meta
      name="description"
      content="Collect Uniswap v3 &amp; v4 LP fees from multiple positions at once — one transaction per chain, 10 chains. Free, no approvals, simulated before you sign."
    />
    <link rel="canonical" href="https://uniclaim.org/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UniClaim" />
    <meta property="og:title" content="Claim Uniswap Fees from Multiple Positions at Once | UniClaim" />
    <meta
      property="og:description"
      content="Collect Uniswap v3 &amp; v4 LP fees from multiple positions at once — one transaction per chain, 10 chains. Free, no approvals, simulated before you sign."
    />
    <meta property="og:url" content="https://uniclaim.org/" />
    <meta property="og:image" content="https://uniclaim.org/og.jpg" />
    <meta property="og:image:alt" content="UniClaim listing Uniswap positions grouped by chain with their unclaimed fees" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Claim Uniswap Fees from Multiple Positions at Once | UniClaim" />
    <meta
      name="twitter:description"
      content="Collect Uniswap v3 &amp; v4 LP fees from multiple positions at once — one transaction per chain."
    />
    <meta name="twitter:image" content="https://uniclaim.org/og.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "UniClaim",
        "url": "https://uniclaim.org/",
        "description": "Claim unclaimed Uniswap v3 and v4 liquidity provider fees from every position you own, batched into one transaction per chain.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and an Ethereum wallet",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Finds every Uniswap v3 and v4 position an address owns",
          "Computes unclaimed fees from live pool state",
          "Claims fees from many positions in a single transaction per chain",
          "Supports Ethereum, Arbitrum, Optimism, Polygon, Base, BNB Chain, Avalanche, Celo, Blast and Robinhood Chain"
        ]
      }
    </script>
    <!--faq-jsonld-->
  </head>
  <body>
    <!--
      React replaces this on mount. The build fills the marker with the landing
      copy (hero, steps, questions) from src/content/landing.ts, so a crawler
      that does not run JavaScript, and a visitor on a slow connection, read the
      same page the app renders.
    -->
    <div id="root">
      <div class="app app--static">
        <main class="main">
          <!--static-landing-->
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
