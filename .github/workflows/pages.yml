name: Deploy to GitHub Pages

# Manual for now: Pages cannot publish from a private repository on the free
# plan. Once the repository is public, or the account is on a plan that allows
# private Pages, uncomment the push trigger below and this becomes automatic.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queue rather than cancel, so a run never publishes
# a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # A project site is served from /<repo>/, so the bundle is built with
          # that prefix. Taken from the Pages config rather than hardcoded.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
          # Optional: without it, only browser-extension wallets can connect.
          VITE_WC_PROJECT_ID: ${{ secrets.VITE_WC_PROJECT_ID }}
        run: pnpm build

      # A single-page app has no file at /some/route, and Pages would answer 404
      # before React ever loads. Serving index.html for unknown paths fixes it.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
